version: '3.8'
services:
  sync-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "5984:5984"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=resilience_mesh
      - DB_USER=mesh_user
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resilience_mesh
      POSTGRES_USER: mesh_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      sync-server:
        condition: service_healthy
    environment:
      - VITE_SYNC_URL=http://localhost:5984

volumes:
  pgdata: